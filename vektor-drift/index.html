<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vektor Drift">
  <meta name="theme-color" content="#04050d">
  <title>Vektor Drift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Vektor Drift Spielfeld"></canvas>

  <!-- Touch-Steuerung (nur auf Touch-Geräten sichtbar) -->
  <div id="touch-controls" aria-hidden="true">
    <div class="cluster cluster-left">
      <div class="tbtn" data-action="left"><span>◀</span></div>
      <div class="tbtn" data-action="right"><span>▶</span></div>
    </div>
    <div class="cluster cluster-right">
      <div class="tbtn tbtn-hyper" data-action="hyper"><span>✦</span></div>
      <div class="tbtn tbtn-thrust" data-action="thrust"><span>▲</span></div>
      <div class="tbtn tbtn-fire" data-action="fire"><span>●</span></div>
    </div>
  </div>

  <div id="top-buttons">
    <button type="button" class="ibtn" data-action="mute" id="btn-mute" title="Ton an/aus (M)">♪</button>
    <button type="button" class="ibtn" data-action="pause" id="btn-pause" title="Pause (P)">❚❚</button>
  </div>

  <form id="name-entry" hidden autocomplete="off">
    <h2>Neuer Highscore!</h2>
    <p id="ne-score"></p>
    <input id="ne-name" maxlength="10" autocapitalize="characters" spellcheck="false" placeholder="DEIN NAME" enterkeyhint="done">
    <button type="submit">Speichern</button>
  </form>

  <script type="module" src="js/main.js"></script>
</body>
</html>
